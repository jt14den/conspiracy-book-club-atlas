[workspace]
name = "conspiracy-book-club-atlas"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.13.*"
nodejs = "22.*"

[tasks]
build = "python tools/build.py"
check = "python tools/check.py"
test-python = "python -m unittest discover -s tests"
test-js = "node tests/test_app.cjs"
check-js = "node --check docs/app.js"
test = { depends-on = ["test-python", "test-js", "check-js"] }
validate = { depends-on = ["check", "test"] }
serve = "python -m http.server 8000 --bind 127.0.0.1 --directory docs"
preview = { depends-on = ["build"], cmd = "python -m http.server 8000 --bind 127.0.0.1 --directory docs" }
